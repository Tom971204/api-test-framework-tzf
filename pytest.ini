# pytest.ini
# pytest 配置文件
#
# 【为什么需要这个文件】
# 不加也能跑，但会有两个问题：
#   1. 在别目录下运行会报 ModuleNotFoundError（找不到 core、config 模块）
#   2. 根目录标识不对，报告路径会乱
#
# 【面试可讲】
# 「我在 pytest.ini 里配置了 rootdir 和 testpaths，
#   这样在任何目录下执行 pytest 都能正确加载项目模块，
#   也避免了手动改 sys.path。」

[pytest]
# 注意：rootdir 不需要在这里配置。
# pytest 会自动把ini 文件所在目录当作 rootdir，写进去反而会报
# "Unknown config option: rootdir"。
#
# testpaths：指定测试文件在哪。好处是直接执行 pytest 时
# 不用每次都写 tests/，也不会误收集 data/ 下的文件。
testpaths = tests

# python_files：什么文件算测试文件
python_files = test_*.py

# python_classes / python_functions：什么算测试类/测试函数
python_classes = Test*
python_functions = test_*

# 报告里显示更详细的原因
addopts = -v --tb=short

# 【注意】
# 默认环境（test）在 config/config.py 里用 os.environ.get("ENV", "test") 控制。
# 这里不写 env 配置，因为默认的 pytest-env 插件在本项目环境里没有安装。
# 需要切环境时直接用命令行：ENV=staging pytest
