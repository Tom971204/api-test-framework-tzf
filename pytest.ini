# pytest configuration file
#
# WHY THIS FILE EXISTS
#   Without it pytest still runs, but two problems appear:
#     1. Running from another directory raises ModuleNotFoundError
#        (cannot locate the core / config packages)
#     2. The rootdir is wrong, so report paths get messed up
#
# INTERVIEW TALKING POINT
#   "I configured testpaths here so pytest always collects from the right
#    place, no matter which directory it is launched from. That avoids
#    manually editing sys.path every time."
#
# NOTE: Comments in THIS file must stay ASCII/English.
#   pytest reads this file through the iniconfig library, which opens it
#   using the system locale encoding (GBK on Chinese Windows). Any
#   non-ASCII character here raises:
#       UnicodeDecodeError: 'gbk' codec can't decode byte 0x80
#   The Chinese explanation of every option lives in README.md instead.

[pytest]
# testpaths: where the test files live. Benefits:
#   - you can just run "pytest" without typing "tests/" every time
#   - pytest will not mistakenly collect files under data/
testpaths = tests

# python_files: which files count as test files
python_files = test_*.py

# python_classes / python_functions: what counts as a test class / function
python_classes = Test*
python_functions = test_*

# Show more detailed failure reasons.
# NOTE: do NOT add "-p no:cacheprovider" here. It breaks plugin collection
# (pytest-html, rerunfailures).
addopts = -v --tb=short

# Multi-environment switching
#   The default environment ("test") is resolved inside config/config.py
#   via os.environ.get("ENV", "test").
#   We do NOT set an "env" option here because the pytest-env plugin is
#   not installed in this project environment.
#   Switch environments from the command line instead:
#       ENV=staging pytest         (Git Bash / Linux / macOS)
#       set ENV=staging && pytest  (Windows CMD)